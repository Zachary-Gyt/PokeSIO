; =====================================================================
; Supervisor : garde Reverb (le multijoueur) allumé en permanence,
; et le relance s'il s'arrête ou si le serveur redémarre.
;   -> /etc/supervisor/conf.d/pokesio-reverb.conf
; =====================================================================
[program:pokesio-reverb]
command=php /var/www/pokesio/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/pokesio
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=10
; Beaucoup de joueurs connectés = beaucoup de fichiers ouverts
minfds=10000
redirect_stderr=true
stdout_logfile=/var/www/pokesio/storage/logs/reverb.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
