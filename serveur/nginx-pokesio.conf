# =====================================================================
# Nginx : le site PokéSIO  ->  /etc/nginx/sites-available/pokesio
# Remplace les 2 « pokesio.fr » par ton domaine. Certbot ajoutera ensuite le HTTPS tout seul.
# =====================================================================
server {
    listen 80;
    listen [::]:80;
    server_name pokesio.fr www.pokesio.fr;

    root /var/www/pokesio/public;
    index index.php;
    charset utf-8;

    # Taille maximale d'une requête (les sauvegardes du jeu sont petites)
    client_max_body_size 2m;

    # Compression : les cartes (.tmj), tilesets (.tsj), scripts et JSON sont bien plus légers
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;

    # ---- Reverb (multijoueur en temps réel) ----
    # Les navigateurs se connectent en wss://ton-domaine/app/... ; Laravel envoie ses messages sur /apps/...
    # Nginx les transmet au serveur Reverb, qui tourne en local sur le port 8080 (lancé par Supervisor).
    location ~ ^/(app|apps)/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 120s;
    }

    # ---- Images et sons du jeu : gardés 30 jours par le navigateur ----
    location ~* ^/game/.+\.(png|ogg|mp3|wav|mid|midi)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Interdit tout le reste : fichiers cachés (.env, .git...) et autres scripts PHP
    location ~ /\.(?!well-known).* { deny all; }
    location ~ \.php$ { return 404; }
}
